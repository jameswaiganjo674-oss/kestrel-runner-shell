name: KESTREL Public Lab Safety Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kestrel-public-lab-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Disclosure, workflow and compatibility guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public laboratory only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Run built-in Node.js audit and regression test
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node tools/public-lab-audit.mjs
          node --test tools/public-lab-audit.test.mjs
